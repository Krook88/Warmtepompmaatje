name: Dagelijkse prijsupdate

on:
  schedule:
    # Elke dag om 05:45 UTC (07:45 Nederlandse zomertijd)
    - cron: "45 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prijzen:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prijzen bijwerken
        env:
          # Bol.com Marketing API (partner): repository secrets; zonder deze
          # secrets worden bol-prijzen overgeslagen en blijft de oude staan
          BOL_CLIENT_ID: ${{ secrets.BOL_CLIENT_ID }}
          BOL_CLIENT_SECRET: ${{ secrets.BOL_CLIENT_SECRET }}
        run: node scripts/update-prices.mjs

      - name: Productpagina's regenereren (prijzen staan ook op de pomp-pagina's)
        run: node scripts/genereer-warmtepomppaginas.mjs

      # Vercel is via de GitHub-app aan deze repo gekoppeld en publiceert
      # automatisch bij elke push naar main; er hoeft hier dus geen
      # publicatie-workflow gestart te worden.
      - name: Wijzigingen committen en pushen
        run: |
          git config user.name "prijsupdate-bot"
          git config user.email "actions@github.com"
          git add data/warmtepompen.json pomp/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Geen prijswijzigingen vandaag."
          else
            git commit -m "Dagelijkse prijsupdate $(date -u +%F)"
            git push
          fi
